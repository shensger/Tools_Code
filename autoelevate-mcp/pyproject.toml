[project]
name = "autoelevate-mcp"
version = "0.1.0"
description = "MCP server for AutoElevate (CyberFOX) with CMMC Level 2 pre-approval analysis"
requires-python = ">=3.11"
dependencies = [
  "mcp>=2.3,<3",
  "httpx>=0.27",
  "pyotp>=2.9",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
test = ["pytest>=8", "respx>=0.21"]

[project.scripts]
autoelevate-mcp = "autoelevate_mcp.server:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
