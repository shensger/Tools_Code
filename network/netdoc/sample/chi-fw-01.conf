#config-version=FGT100F-7.2.8-FW-build1639-240313:opmode=0:vdom=0:user=admin
#conf_file_ver=12345
#buildno=1639
config system global
    set hostname "chi-fw-01"
    set admin-sport 8443
end
config system interface
    edit "port1"
        set vdom "root"
        set ip 203.0.113.10 255.255.255.248
        set allowaccess ping https ssh http
        set type physical
        set role wan
        set alias "ISP-A"
    next
    edit "port2"
        set vdom "root"
        set type physical
        set description "chi-core-01 ae1"
    next
    edit "port2.100"
        set vdom "root"
        set ip 10.0.0.1 255.255.255.248
        set allowaccess ping
        set interface "port2"
        set vlanid 100
        set role lan
    next
    edit "mgmt"
        set ip 172.16.0.1 255.255.255.0
        set allowaccess ping https ssh
        set type physical
    next
end
config system zone
    edit "INSIDE"
        set interface "port2.100"
    next
end
config system ntp
    set ntpsync enable
    config ntpserver
        edit 1
            set server "10.10.10.5"
        next
    end
end
config firewall vip
    edit "VIP-WEB"
        set extip 203.0.113.12
        set mappedip "10.10.20.50"
        set extintf "port1"
    next
    edit "VIP-SFTP"
        set extip 203.0.113.13
        set mappedip "10.10.20.60"
        set extintf "port1"
        set portforward enable
        set extport 22
        set mappedport 22
    next
end
config firewall policy
    edit 1
        set name "inside-out"
        set srcintf "INSIDE"
        set dstintf "port1"
        set action accept
        set srcaddr "all"
        set dstaddr "all"
        set schedule "always"
        set service "ALL"
        set nat enable
    next
    edit 2
        set name "web-in"
        set srcintf "port1"
        set dstintf "INSIDE"
        set action accept
        set srcaddr "all"
        set dstaddr "VIP-WEB"
        set schedule "always"
        set service "HTTPS"
        set logtraffic disable
    next
end
config vpn ipsec phase1-interface
    edit "to-SLC"
        set interface "port1"
        set ike-version 1
        set peertype any
        set proposal 3des-sha1 aes256-sha256
        set dhgrp 2 14
        set remote-gw 198.51.100.7
        set psksecret ENC abcdefg==
    next
end
config vpn ipsec phase2-interface
    edit "to-SLC-p2"
        set phase1name "to-SLC"
        set src-subnet 10.10.0.0 255.255.0.0
        set dst-subnet 10.20.0.0 255.255.0.0
    next
end
config router static
    edit 1
        set gateway 203.0.113.9
        set device "port1"
    next
    edit 2
        set dst 10.10.0.0 255.255.0.0
        set gateway 10.0.0.2
        set device "port2.100"
    next
    edit 3
        set dst 10.20.0.0 255.255.0.0
        set device "to-SLC"
    next
end
