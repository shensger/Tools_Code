version 21.4R3.15;
system {
    host-name chi-dist-01;
    ntp {
        server 10.10.10.5;
    }
}
chassis {
    aggregated-devices {
        ethernet {
            device-count 1;
        }
    }
}
interfaces {
    xe-0/0/10 {
        description "to chi-core-01";
        unit 0 {
            family ethernet-switching {
                interface-mode access;
                vlan {
                    members SERVERS;
                }
            }
        }
    }
    xe-0/0/48 {
        ether-options {
            802.3ad ae0;
        }
    }
    xe-0/0/49 {
        ether-options {
            802.3ad ae0;
        }
    }
    ae0 {
        description "chi-core-01 ae0";
        aggregated-ether-options {
            lacp {
                active;
            }
        }
        unit 0 {
            family ethernet-switching {
                interface-mode trunk;
                vlan {
                    members [ USERS SERVERS STOR ];
                }
            }
        }
    }
    ae2 {
        description "future storage";
        aggregated-ether-options {
            lacp {
                active;
            }
        }
    }
    irb {
        unit 220 {
            family inet {
                address 10.10.220.1/24;
            }
        }
    }
    /* management */
    em0 {
        unit 0 {
            family inet {
                address 172.16.0.12/24;
            }
        }
    }
}
vlans {
    USERS {
        vlan-id 10;
    }
    SERVERS {
        vlan-id 20;
    }
    STOR {
        vlan-id 220;
        l3-interface irb.220;
    }
    OLD-VOICE {
        vlan-id 300;
    }
}
protocols {
    lldp {
        interface all;
    }
}
